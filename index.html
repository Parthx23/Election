<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Election Quest – Home</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
  darkMode:"class",
  theme:{ extend:{
    colors:{
      "outline":"#807660","primary-fixed":"#ffe08b","surface-container-low":"#fcf3e1",
      "outline-variant":"#d1c5ac","secondary":"#535f74","primary-fixed-dim":"#f0c110",
      "on-surface-variant":"#4e4633","surface-container-highest":"#ebe1d1",
      "surface-container-high":"#f1e7d6","background":"#fff8f1","surface-variant":"#ebe1d1",
      "tertiary":"#00687c","primary":"#745b00","on-primary":"#ffffff","on-background":"#1f1b11",
      "surface-container":"#f6eddc","on-surface":"#1f1b11","secondary-container":"#d4e0f9",
      "surface-container-lowest":"#ffffff","on-primary-container":"#695200",
      "error":"#ba1a1a","error-container":"#ffdad6","on-error-container":"#93000a",
      "secondary-fixed-dim":"#bbc7df","on-secondary-container":"#586378",
      "surface-bright":"#fff8f1","surface":"#fff8f1","primary-container":"#f5c518",
      "surface-tint":"#745b00","tertiary-container":"#49dbff","on-tertiary":"#ffffff",
      "on-tertiary-container":"#005e70","tertiary-fixed":"#b0ecff","tertiary-fixed-dim":"#42d7fb",
      "inverse-surface":"#353025","inverse-on-surface":"#f9f0de","inverse-primary":"#f0c110",
    },
    borderRadius:{"DEFAULT":"0.125rem","lg":"0.25rem","xl":"0.5rem","full":"0.75rem"},
    fontFamily:{"sans":["Public Sans","sans-serif"]},
    fontSize:{
      "display-lg":["48px",{"lineHeight":"1.1","letterSpacing":"-0.02em","fontWeight":"700"}],
      "headline-xl":["32px",{"lineHeight":"1.2","letterSpacing":"-0.01em","fontWeight":"700"}],
      "headline-md":["24px",{"lineHeight":"1.3","fontWeight":"600"}],
      "body-lg":["18px",{"lineHeight":"1.6","fontWeight":"400"}],
      "body-md":["16px",{"lineHeight":"1.5","fontWeight":"400"}],
      "label-sm":["12px",{"lineHeight":"1","letterSpacing":"0.05em","fontWeight":"600"}]
    }
  }}
}
</script>
<style>
  body{font-family:'Public Sans',sans-serif;background:#fff8f1;}
  .glow-effect{box-shadow:0 0 24px rgba(245,197,24,0.45);}
</style>
</head>
<body class="min-h-screen flex flex-col text-on-background relative overflow-x-hidden">

<!-- Watermark -->
<div class="absolute inset-0 z-0 opacity-[0.03] pointer-events-none bg-cover bg-center"
     style="background-image:url('https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/India_location_map.svg/800px-India_location_map.svg.png')"></div>

<!-- Header -->
<header class="bg-white w-full border-b border-slate-200 z-50 relative">
  <div class="flex justify-between items-center w-full px-8 py-4 max-w-screen-2xl mx-auto">
    <div class="flex items-center gap-12">
      <a href="index.html" class="text-2xl font-black tracking-tighter text-slate-900">ELECTION QUEST</a>
      <nav class="hidden md:flex gap-8">
        <a href="map.html"         class="text-slate-600 font-medium hover:text-yellow-600 transition-colors">Classroom</a>
        <a href="leaderboard.html" class="text-slate-600 font-medium hover:text-yellow-600 transition-colors">Leaderboard</a>
        <a href="trophies.html"    class="text-slate-600 font-medium hover:text-yellow-600 transition-colors">Trophies</a>
      </nav>
    </div>
    <div class="flex items-center gap-6">
      <a href="trophies.html" class="text-slate-600 hover:text-yellow-600 transition-colors">
        <span class="material-symbols-outlined">military_tech</span>
      </a>
      <button id="hdrPlayer" class="text-slate-600 hover:text-yellow-600 transition-colors">
        <span class="material-symbols-outlined">account_circle</span>
      </button>
    </div>
  </div>
</header>

<!-- Main -->
<main class="flex-grow flex flex-col items-center justify-center relative z-10 px-6 py-24">
  <!-- Hero -->
  <div class="max-w-2xl w-full flex flex-col items-center text-center mb-24">
    <div class="w-24 h-24 rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center mb-8 shadow-lg">
      <span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings:'FILL' 1">how_to_vote</span>
    </div>
    <h1 class="text-display-lg text-primary tracking-widest mb-6">ELECTION QUEST</h1>
    <p class="text-headline-md text-on-surface-variant mb-12 max-w-lg mx-auto border-l-4 border-primary pl-6 py-2 text-left bg-surface-container-lowest shadow-sm">
      Learn democracy. Earn your vote.
    </p>
    <!-- Form -->
    <div class="w-full max-w-md bg-surface-container-lowest p-8 rounded-xl border border-outline-variant shadow-lg flex flex-col gap-6">
      <div class="flex flex-col gap-2 text-left">
        <label class="text-label-sm text-secondary uppercase tracking-widest" for="playerName">Citizen Designation</label>
        <input id="playerName" class="w-full bg-surface border border-outline rounded p-4 text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
               placeholder="Enter Player Name" type="text"/>
      </div>
      <button id="startBtn" class="w-full bg-primary-container text-on-primary-container text-headline-md py-4 rounded-lg glow-effect hover:bg-primary-fixed transition-colors border border-yellow-400 flex items-center justify-center gap-3">
        Start Game
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>
    </div>
  </div>

  <!-- Mini Leaderboard -->
  <div class="w-full max-w-3xl border-t border-outline-variant pt-16">
    <h2 class="text-label-sm text-secondary uppercase tracking-widest text-center mb-8">Hall of Records – All‑Time Top Scores</h2>
    <div id="miniLeaderboard" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
  </div>
</main>

<!-- Footer -->
<footer class="bg-white w-full border-t border-slate-100 mt-auto z-10 relative">
  <div class="flex flex-col md:flex-row justify-between items-center px-12 py-8 max-w-7xl mx-auto gap-8">
    <div class="text-xs font-bold text-slate-900 uppercase tracking-widest">© 2024 Election Quest Educational Journal</div>
    <nav class="flex flex-wrap justify-center gap-8 text-xs uppercase tracking-widest">
      <a href="#" class="text-slate-400 hover:text-slate-900 transition-colors">Privacy Policy</a>
      <a href="#" class="text-slate-400 hover:text-slate-900 transition-colors">Terms of Service</a>
    </nav>
  </div>
</footer>

<script type="module">
import { getState, setState, getLeaderboard, evaluateBadges } from './src/state.js';

const RANK_ICONS = ['workspace_premium','military_tech','military_tech'];
const RANK_COLORS = ['text-primary','text-secondary','text-outline'];

function renderLeaderboard() {
  const board = getLeaderboard().slice(0,3);
  const el = document.getElementById('miniLeaderboard');
  el.innerHTML = board.map((p,i) => `
    <div class="bg-surface-container-lowest border border-outline-variant rounded p-6 flex flex-col items-center text-center relative overflow-hidden hover:border-primary transition-colors">
      <div class="absolute top-0 w-full h-1 ${i===0?'bg-primary':i===1?'bg-secondary-fixed-dim':'bg-outline-variant'}"></div>
      <span class="material-symbols-outlined ${RANK_COLORS[i]||'text-outline'} text-[32px] mb-2" style="font-variation-settings:'FILL' 1">${RANK_ICONS[i]||'star'}</span>
      <h3 class="text-headline-md text-on-surface mb-1">${p.name}</h3>
      <p class="text-body-md text-secondary">Score: ${p.score.toLocaleString()}</p>
    </div>`).join('');
}

// Pre-fill saved name
const s = getState();
document.getElementById('playerName').value = s.playerName !== 'Civic Leader' ? s.playerName : '';
renderLeaderboard();

document.getElementById('startBtn').addEventListener('click', () => {
  const name = document.getElementById('playerName').value.trim() || 'Civic Leader';
  setState({ playerName: name });
  evaluateBadges();
  window.location.href = 'map.html';
});
document.getElementById('playerName').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('startBtn').click(); });
</script>
</body>
</html>
